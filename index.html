<!doctype html>
<html lang="zh-CN">
  <head>
    <meta name="theme-color" content="#007aff" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>小龙资产账本 V4 · 移动全功能版</title>
    <style>
      :root {
        --bg: #f2f2f7;
        --card: rgba(255, 255, 255, 0.9);
        --text: #1c1c1e;
        --muted: #8e8e93;
        --line: rgba(60, 60, 67, 0.12);
        --blue: #007aff;
        --purple: #af52de;
        --pink: #ff2d55;
        --green: #34c759;
        --red: #ff3b30;
        --orange: #ff9500;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        --radius: 18px;
        --radius-sm: 12px;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at 10% 0%, rgba(255, 45, 85, 0.1), transparent 25%),
          radial-gradient(circle at 90% 5%, rgba(175, 82, 222, 0.1), transparent 28%),
          var(--bg);
        color: var(--text);
        line-height: 1.45;
        padding-bottom: calc(90px + env(safe-area-inset-bottom));
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 16px 14px 40px;
      }

      header {
        padding: 20px 18px;
        margin-bottom: 14px;
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.85);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.8);
      }

      h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0 0 4px;
      }

      .sub {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }

      /* 核心指标看板 */
      .summary {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }

      .summary .metric:first-child {
        grid-column: span 2;
        background: linear-gradient(135deg, #1c1c1e, #2c2c2e);
        color: #ffffff;
      }
      .summary .metric:first-child .k,
      .summary .metric:first-child .delta {
        color: rgba(255, 255, 255, 0.65);
      }
      .summary .metric:first-child .v {
        font-size: 28px;
      }

      .metric {
        padding: 14px;
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.7);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .metric .k {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .metric .v {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }

      .metric .delta {
        font-size: 11px;
        margin-top: 4px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 多维周期对比看板卡片 */
      .period-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 10px;
      }

      .period-item {
        background: rgba(255, 255, 255, 0.6);
        border-radius: var(--radius-sm);
        padding: 10px 8px;
        text-align: center;
        border: 1px solid var(--line);
      }

      .period-item .pk {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .period-item .pv {
        font-size: 14px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .period-item .psub {
        font-size: 10px;
        color: var(--muted);
        margin-top: 2px;
      }

      .grid {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .card {
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 16px;
      }

      .card h2 {
        margin: 0 0 12px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .between {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .small {
        font-size: 12px;
        color: var(--muted);
      }

      label {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        display: block;
        margin-bottom: 5px;
      }

      .field {
        margin-bottom: 12px;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, 0.95);
        padding: 10px 12px;
        font-size: 16px; /* 防止 iOS Safari 自动缩放 */
        color: var(--text);
        outline: none;
        -webkit-appearance: none;
        transition: border-color 0.15s ease;
      }

      select {
        background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%238E8E93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 12px center;
        padding-right: 32px;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--blue);
      }

      textarea {
        min-height: 64px;
        resize: vertical;
      }

      .cols {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .cols4 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      button,
      .btn-label {
        border: 0;
        border-radius: 999px;
        padding: 11px 18px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        background: #ffffff;
        color: var(--text);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        touch-action: manipulation;
        transition: transform 0.1s ease, opacity 0.15s ease;
      }

      button:active,
      .btn-label:active {
        transform: scale(0.97);
        opacity: 0.85;
      }

      button.primary {
        background: linear-gradient(135deg, var(--blue), var(--purple));
        color: #ffffff;
      }

      button.green {
        background: var(--green);
        color: #ffffff;
      }

      button.danger {
        background: var(--red);
        color: #ffffff;
      }

      button.ghost,
      .btn-label.ghost {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--line);
        box-shadow: none;
      }

      .pos { color: var(--green); }
      .neg { color: var(--red); }

      /* 卡片式历史记录流 */
      .history-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .history-card {
        background: rgba(255, 255, 255, 0.75);
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        padding: 14px;
      }

      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px dashed var(--line);
        padding-bottom: 8px;
        margin-bottom: 10px;
      }

      .history-title {
        font-weight: 700;
        font-size: 15px;
      }

      .history-date {
        font-size: 12px;
        color: var(--muted);
      }

      /* 收益拆解胶囊条 */
      .breakdown-strip {
        display: flex;
        background: rgba(0, 0, 0, 0.035);
        border-radius: 8px;
        padding: 6px 10px;
        gap: 10px;
        font-size: 11px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }

      .breakdown-strip span b {
        font-variant-numeric: tabular-nums;
      }

      .history-data-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 10px;
      }

      .data-item .k {
        font-size: 11px;
        color: var(--muted);
      }

      .data-item .v {
        font-size: 14px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .history-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding-top: 6px;
      }

      .pill {
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0, 122, 255, 0.1);
        color: var(--blue);
        font-size: 12px;
        font-weight: 600;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 30px 14px;
        font-size: 13px;
      }

      .hide {
        display: none !important;
      }

      .chartRow {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .chartBox {
        height: 250px;
        position: relative;
        width: 100%;
      }

      canvas {
        width: 100% !important;
        height: 100% !important;
      }

      .pieLegend {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
      }

      .legendItem {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.65);
        font-size: 12px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 6px;
      }

      /* 账户录入单项 */
      .account-line {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
        padding: 12px;
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid var(--line);
      }

      .account-line-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .account-line.liability {
        background: rgba(255, 59, 48, 0.05);
        border-color: rgba(255, 59, 48, 0.2);
      }

      .hint {
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: rgba(0, 122, 255, 0.08);
        color: #0c4a6e;
        line-height: 1.5;
        margin-bottom: 12px;
        font-size: 12px;
      }

      /* 实时投资盈亏计算提示卡 */
      .gain-calc-preview {
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: rgba(52, 199, 89, 0.09);
        border: 1px solid rgba(52, 199, 89, 0.25);
        color: #1b5e20;
        font-size: 12px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* 底部常驻悬浮栏 */
      .fixed-bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid var(--line);
        padding: 10px 16px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        display: flex;
        gap: 10px;
        z-index: 99;
      }

      .fixed-bottom-bar button {
        flex: 1;
        padding: 13px;
        font-size: 15px;
      }

      /* 电脑端平板适配 */
      @media (min-width: 768px) {
        .summary {
          grid-template-columns: repeat(4, 1fr);
        }
        .summary .metric:first-child {
          grid-column: span 1;
          background: var(--card);
          color: var(--text);
        }
        .summary .metric:first-child .k,
        .summary .metric:first-child .delta {
          color: var(--muted);
        }
        .summary .metric:first-child .v {
          font-size: 20px;
        }
        .chartRow {
          display: grid;
          grid-template-columns: 1.35fr 0.65fr;
        }
        .chartBox {
          height: 320px;
        }
        .cols {
          grid-template-columns: 1fr 1fr;
        }
        .cols4 {
          grid-template-columns: repeat(4, 1fr);
        }
        .account-line {
          display: grid;
          grid-template-columns: 1.1fr 0.95fr 0.65fr 0.85fr 0.75fr 0.9fr auto;
          align-items: end;
        }
        .account-line-row {
          display: contents;
        }
        .fixed-bottom-bar {
          display: none;
        }
        body {
          padding-bottom: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>小龙资产账本</h1>
        <div class="sub">
          V4 增强版：分离储蓄与投资盈亏 · 一键实时汇率 · 多维周期对比。
        </div>
      </header>

      <!-- 核心指标摘要 -->
      <section class="summary" id="summary"></section>

      <!-- 周期对比卡片 (YTD / YoY / 累计回报) -->
      <section class="card" id="periodCard">
        <h2>📊 多维财务周期对比</h2>
        <div class="period-grid" id="periodGrid"></div>
      </section>

      <div class="grid">
        <!-- 图表展示 -->
        <section class="card">
          <div class="chartRow">
            <div>
              <div class="between">
                <h2>资产 / 净资产趋势</h2>
                <div class="row">
                  <select id="chartMetric" style="width: 140px">
                    <option value="netWorth">净资产</option>
                    <option value="totalAssets">总资产</option>
                    <option value="liability">负债</option>
                    <option value="cash">现金/银行卡</option>
                    <option value="investment">投资账户</option>
                    <option value="mandate">委托投资</option>
                    <option value="other">其他资产</option>
                  </select>
                </div>
              </div>
              <div class="chartBox"><canvas id="lineChart"></canvas></div>
            </div>

            <div>
              <div class="between">
                <h2>资产结构</h2>
                <select id="structureChartType" style="width: 130px">
                  <option value="pie">最新占比</option>
                  <option value="stacked">堆叠图</option>
                </select>
              </div>
              <div class="chartBox"><canvas id="structureChart"></canvas></div>
              <div id="pieLegend" class="pieLegend"></div>
            </div>
          </div>
        </section>

        <!-- 历史记录展示 -->
        <section class="card">
          <div class="between">
            <h2>历史记录</h2>
            <div class="row">
              <button class="ghost" onclick="exportXlsx()">导出 .xlsx</button>
              <button class="ghost" onclick="exportJson()">JSON 备份</button>
              <label class="btn-label ghost">
                导入备份
                <input
                  type="file"
                  accept=".json"
                  onchange="importJson(event)"
                  style="display: none"
                />
              </label>
            </div>
          </div>
          <div id="records"></div>
        </section>

        <!-- 表单录入 -->
        <section class="card" id="formCard">
          <h2 id="formTitle">新增资产记录</h2>
          <div class="cols">
            <div class="field">
              <label>记录日期</label>
              <input id="date" type="date" />
            </div>
            <div class="field">
              <label>记录名称</label>
              <input id="title" placeholder="例如：2026年6月资产汇总" />
            </div>
          </div>

          <!-- 储蓄净投入与投资收益分离核心字段 -->
          <div class="field">
            <label>本期外部净投入 / 新增储蓄 CNY (可选)</label>
            <input
              id="savings"
              type="number"
              step="0.01"
              inputmode="decimal"
              placeholder="本期工资结余存入填正数，大额开支取出填负数，无变动填0"
            />
            <div style="font-size: 11px; color: var(--muted); margin-top: 4px;">
              💡 系统据此自动计算：<b>投资盈亏 = 本期净资产变动 - 外部净投入</b>
            </div>
          </div>

          <!-- 动态收益计算预览条 -->
          <div id="gainPreviewBar" class="gain-calc-preview hide">
            <span>预计本期投资盈亏：<b id="previewGainVal">--</b></span>
            <span id="previewGainRate" style="font-size:11px;"></span>
          </div>

          <div class="hint">
            汇率在各账户按原币录入。点击下方按钮可自动联网更新最新外币汇率。
          </div>

          <div class="field">
            <div class="between" style="margin-bottom: 6px;">
              <label style="margin: 0;">账户与负债明细</label>
              <button class="ghost" id="rateBtn" style="padding: 6px 12px; font-size: 12px;" onclick="fetchLiveRates()">
                ⚡ 一键获取最新汇率
              </button>
            </div>
            <div id="accountLines"></div>
            <button
              class="ghost"
              style="width: 100%; margin-top: 8px"
              onclick="addAccountLine()"
            >
              + 添加账户或负债细项
            </button>
          </div>

          <div class="cols4">
            <div class="field">
              <label>现金/银行卡合计 CNY</label>
              <input id="cash" type="number" step="0.01" inputmode="decimal" />
            </div>
            <div class="field">
              <label>投资账户合计 CNY</label>
              <input id="investment" type="number" step="0.01" inputmode="decimal" />
            </div>
            <div class="field">
              <label>委托投资合计 CNY</label>
              <input id="mandate" type="number" step="0.01" inputmode="decimal" />
            </div>
            <div class="field">
              <label>其他资产合计 CNY</label>
              <input id="other" type="number" step="0.01" inputmode="decimal" />
            </div>
          </div>

          <div class="cols">
            <div class="field">
              <label>负债合计 CNY</label>
              <input id="liability" type="number" step="0.01" inputmode="decimal" />
            </div>
            <div class="field">
              <label>净资产 CNY (自动汇总)</label>
              <input id="netWorthPreview" readonly style="background: rgba(0,0,0,0.03); font-weight:700;" />
            </div>
          </div>

          <div class="field">
            <label>备注说明</label>
            <textarea id="note" placeholder="记录当月的重大资产变动、投资心得或市场环境..."></textarea>
          </div>

          <div class="row" style="margin-top: 8px">
            <button class="primary" style="flex: 1" onclick="saveRecord()">
              保存此条记录
            </button>
            <button class="ghost" onclick="copyLatestRecord()">
              复制上一期
            </button>
            <button class="ghost" onclick="resetForm()">重置</button>
            <button
              id="deleteEditing"
              class="danger hide"
              onclick="deleteCurrentEditing()"
            >
              删除
            </button>
          </div>
        </section>

        <!-- 云同步配置 -->
        <section class="card">
          <h2>☁ 云端同步 (GitHub Gist)</h2>
          <div class="field">
            <label>GitHub Personal Token</label>
            <input id="githubToken" type="password" placeholder="ghp_..." />
          </div>
          <div class="field">
            <label>Gist ID</label>
            <input id="gistId" placeholder="对应 Gist 的哈希 ID" />
          </div>
          <div class="row">
            <button class="primary" onclick="saveCloudSettings()">保存配置</button>
            <button class="ghost" onclick="testCloudConnection()">测试连接</button>
            <button class="ghost" onclick="syncUpload()">上传备份</button>
            <button class="ghost" onclick="syncDownload()">恢复下载</button>
          </div>
          <div id="syncStatus" class="small" style="margin-top: 10px">尚未同步</div>
        </section>

        <!-- 数据辅助 -->
        <section class="card">
          <h2>数据辅助</h2>
          <div class="row">
            <button class="green" onclick="fillDemo()">填入示例数据</button>
            <button class="danger" onclick="clearAll()">清空所有数据</button>
          </div>
        </section>
      </div>
    </div>

    <!-- 移动端底部悬浮操作条 -->
    <div class="fixed-bottom-bar">
      <button class="primary" onclick="scrollToForm()">+ 记一笔新账</button>
      <button class="ghost" onclick="copyLatestRecord()">复制上期</button>
    </div>

    <datalist id="currencyList">
      <option value="CNY"></option>
      <option value="USD"></option>
      <option value="HKD"></option>
      <option value="EUR"></option>
      <option value="JPY"></option>
      <option value="GBP"></option>
      <option value="AUD"></option>
      <option value="SGD"></option>
    </datalist>

    <script>
      const KEY = "xiaolong_asset_ledger_v4",
        OLD_KEYS = [
          "xiaolong_asset_ledger_v3",
          "xiaolong_asset_ledger_v2",
          "xiaolong_asset_ledger_v1",
        ];
      const CLOUD_CONFIG_KEY = "xiaolong_cloud_config_v5";
      let records = load(),
        editingId = null;

      const COLORS = {
          cash: "#007aff",
          investment: "#af52de",
          mandate: "#ff2d55",
          other: "#34c759",
          liability: "#ff3b30",
          netWorth: "#1c1c1e",
          totalAssets: "#5856d6",
        },
        TYPE_NAME = {
          cash: "现金/银行卡",
          investment: "投资账户",
          mandate: "委托投资",
          other: "其他资产",
          liability: "负债",
        };

      function num(v) {
        return Number(v || 0);
      }

      function today() {
        return new Date().toISOString().slice(0, 10);
      }

      function fmt(n) {
        return new Intl.NumberFormat("zh-CN", {
          style: "currency",
          currency: "CNY",
          maximumFractionDigits: 2,
        }).format(num(n));
      }

      function shortMoney(v) {
        v = num(v);
        if (Math.abs(v) >= 1e8) return (v / 1e8).toFixed(1) + "亿";
        if (Math.abs(v) >= 1e4) return (v / 1e4).toFixed(1) + "万";
        return Math.round(v);
      }

      function esc(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m],
        );
      }

      function migrateOld(r) {
        return (r || []).map((x) => {
          let y = { ...x };
          y.mandate = num(y.mandate);
          y.liability = num(y.liability);
          y.savings = num(y.savings);
          y.totalAssets = num(
            y.totalAssets ||
              num(y.cash) + num(y.investment) + num(y.mandate) + num(y.other),
          );
          y.netWorth = num(y.netWorth || y.totalAssets - y.liability);
          const rates = y.rates || { CNY: 1 };
          y.accounts = (y.accounts || []).map((a) => {
            const currency = (a.currency || "CNY").toUpperCase(),
              rate = num(a.rate || rates[currency] || 1),
              amount = num(a.amount);
            return {
              ...a,
              currency,
              rate,
              amount,
              baseAmount: num(a.baseAmount || amount * rate),
            };
          });
          delete y.rates;
          return y;
        });
      }

      function load() {
        try {
          let v = JSON.parse(localStorage.getItem(KEY) || "null");
          if (Array.isArray(v)) return migrateOld(v);
          for (const k of OLD_KEYS) {
            let o = JSON.parse(localStorage.getItem(k) || "null");
            if (Array.isArray(o) && o.length) return migrateOld(o);
          }
          return [];
        } catch (e) {
          return [];
        }
      }

      function persist() {
        localStorage.setItem(KEY, JSON.stringify(records));
        renderAll();
      }

      /* 一键拉取实时汇率 */
      async function fetchLiveRates() {
        const btn = document.getElementById("rateBtn");
        const origText = btn.innerHTML;
        btn.innerHTML = "⏳ 获取汇率中...";
        btn.disabled = true;
        try {
          const res = await fetch("https://open.er-api.com/v6/latest/CNY");
          if (!res.ok) throw new Error("汇率服务暂不可用");
          const data = await res.json();
          const rates = data.rates;
          let count = 0;
          lines().forEach((line) => {
            const cur = (line.querySelector(".acc-currency").value || "CNY").trim().toUpperCase();
            if (cur === "CNY") {
              line.querySelector(".acc-rate").value = 1;
            } else if (rates[cur]) {
              const cnyRate = Number((1 / rates[cur]).toFixed(4));
              line.querySelector(".acc-rate").value = cnyRate;
              count++;
            }
          });
          calcTotals();
          alert(`已成功自动更新 ${count} 个外币账户的最新汇率！`);
        } catch (err) {
          alert("获取实时汇率失败：" + err.message + "，您仍可手动修改汇率。");
        } finally {
          btn.innerHTML = origText;
          btn.disabled = false;
        }
      }

      function lines() {
        return [...document.querySelectorAll(".account-line")];
      }

      function getAccounts() {
        return lines()
          .map((l) => {
            const currency = (l.querySelector(".acc-currency").value || "CNY").trim().toUpperCase(),
              amount = num(l.querySelector(".acc-amount").value),
              rate = num(l.querySelector(".acc-rate").value || 1);
            return {
              name: l.querySelector(".acc-name").value.trim(),
              type: l.querySelector(".acc-type").value,
              currency,
              amount,
              rate,
              baseAmount: amount * rate,
            };
          })
          .filter((a) => a.name || a.amount);
      }

      function calcTotals() {
        const sums = {
          cash: 0,
          investment: 0,
          mandate: 0,
          other: 0,
          liability: 0,
        };
        lines().forEach((l) => {
          const type = l.querySelector(".acc-type").value,
            base =
              num(l.querySelector(".acc-amount").value) *
              num(l.querySelector(".acc-rate").value || 1);
          l.querySelector(".acc-base").value = base ? base.toFixed(2) : "";
          sums[type] += base;
        });

        ["cash", "investment", "mandate", "other", "liability"].forEach((k) => {
          const el = document.getElementById(k);
          if (document.activeElement !== el)
            el.value = sums[k] ? sums[k].toFixed(2) : "";
        });

        const currentNet = sums.cash + sums.investment + sums.mandate + sums.other - sums.liability;
        document.getElementById("netWorthPreview").value = fmt(currentNet);

        // 动态投资盈亏实时测算
        calcGainPreview(currentNet);
      }

      function calcGainPreview(currentNet) {
        const bar = document.getElementById("gainPreviewBar");
        if (!records.length) {
          bar.classList.add("hide");
          return;
        }

        // 找到对比基期（如果是编辑旧记录，找它的前一条；如果是新增，找最新的一条）
        let prevRec = null;
        if (editingId) {
          const idx = records.findIndex((r) => r.id === editingId);
          if (idx > 0) prevRec = records[idx - 1];
        } else {
          prevRec = records[records.length - 1];
        }

        if (!prevRec) {
          bar.classList.add("hide");
          return;
        }

        const savingsVal = num(document.getElementById("savings").value);
        const netDelta = currentNet - prevRec.netWorth;
        const gain = netDelta - savingsVal;
        const base = prevRec.netWorth + Math.max(0, savingsVal);
        const gainRate = base > 0 ? (gain / base) * 100 : 0;

        bar.classList.remove("hide");
        const valEl = document.getElementById("previewGainVal");
        valEl.textContent = (gain >= 0 ? "+" : "") + fmt(gain);
        valEl.className = gain >= 0 ? "pos" : "neg";

        document.getElementById("previewGainRate").textContent = `(本期收益率: ${(gain >= 0 ? "+" : "") + gainRate.toFixed(2)}%)`;
      }

      document.getElementById("savings")?.addEventListener("input", () => {
        const net = num(document.getElementById("cash").value) +
          num(document.getElementById("investment").value) +
          num(document.getElementById("mandate").value) +
          num(document.getElementById("other").value) -
          num(document.getElementById("liability").value);
        calcGainPreview(net);
      });

        rec.totalAssets = rec.cash + rec.investment + rec.mandate + rec.other;

      /* 多维周期对比计算 */
      function getPeriodMetrics() {
        if (!records.length) return null;
        const latest = records[records.length - 1];
        const curYear = latest.date.slice(0, 4);

        // 1. 年初基点 (找上一年最后一条，或者今年第一条)
        const prevYearRecords = records.filter((r) => r.date.slice(0, 4) < curYear);
        const ytdBase = prevYearRecords.length
          ? prevYearRecords[prevYearRecords.length - 1]
          : records.find((r) => r.date.slice(0, 4) === curYear);

        let ytdDelta = 0, ytdRate = 0;
        if (ytdBase && ytdBase !== latest) {
          ytdDelta = latest.netWorth - ytdBase.netWorth;
          ytdRate = ytdBase.netWorth ? (ytdDelta / ytdBase.netWorth) * 100 : 0;
        }

        // 2. 近一年同比 (YoY): 寻找大约 300~420 天前的记录
        const targetDate = new Date(new Date(latest.date).getTime() - 365 * 86400000);
        let yoyBase = null, minDiff = Infinity;
        records.forEach((r) => {
          if (r === latest) return;
          const diff = Math.abs(new Date(r.date).getTime() - targetDate.getTime());
          if (diff < minDiff && diff < 120 * 86400000) {
            minDiff = diff;
            yoyBase = r;
          }
        });

        let yoyDelta = 0, yoyRate = 0;
        if (yoyBase) {
          yoyDelta = latest.netWorth - yoyBase.netWorth;
          yoyRate = yoyBase.netWorth ? (yoyDelta / yoyBase.netWorth) * 100 : 0;
        }

        // 3. 历史累计投资回报与累计净投入
        let totalSavings = 0, totalGain = 0;
        for (let i = 1; i < records.length; i++) {
          const cur = records[i], prev = records[i - 1];
          const s = num(cur.savings);
          totalSavings += s;
          totalGain += (cur.netWorth - prev.netWorth - s);
        }

        return {
          ytdDelta, ytdRate, ytdBaseDate: ytdBase ? ytdBase.date : null,
          yoyDelta, yoyRate, yoyBaseDate: yoyBase ? yoyBase.date : null,
          totalGain, totalSavings
        };
      }

      function setupCanvas(id) {
        const c = document.getElementById(id),
          box = c.parentElement,
          ctx = c.getContext("2d"),
          dpr = window.devicePixelRatio || 1;
        c.width = box.clientWidth * dpr;
        c.height = box.clientHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, box.clientWidth, box.clientHeight);
        return { ctx, w: box.clientWidth, h: box.clientHeight };
      }

      function drawLineChart() {
        const { ctx, w, h } = setupCanvas("lineChart"),
          m = document.getElementById("chartMetric").value;
        if (records.length < 2) {
          ctx.fillStyle = "#8e8e93";
          ctx.font = "14px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("至少需要两条记录展示趋势", w / 2, h / 2);
          return;
        }

        const pad = { l: 52, r: 16, t: 20, b: 36 },
          vals = records.map((r) => num(r[m]));
        let min = Math.min(...vals),
          max = Math.max(...vals);
        if (min === max) {
          min -= 1;
          max += 1;
        }
        if (min > 0) min *= 0.95;

        for (let i = 0; i < 4; i++) {
          let yy = pad.t + (i * (h - pad.t - pad.b)) / 3;
          ctx.strokeStyle = "rgba(60,60,67,0.08)";
          ctx.beginPath();
          ctx.moveTo(pad.l, yy);
          ctx.lineTo(w - pad.r, yy);
          ctx.stroke();
          ctx.fillStyle = "#8e8e93";
          ctx.font = "11px -apple-system, sans-serif";
          ctx.textAlign = "right";
          ctx.fillText(shortMoney(max - ((max - min) * i) / 3), pad.l - 6, yy + 4);
        }

        const x = (i) => pad.l + (i * (w - pad.l - pad.r)) / (records.length - 1),
          y = (v) => h - pad.b - ((v - min) * (h - pad.t - pad.b)) / (max - min);

        let g = ctx.createLinearGradient(0, 0, w, 0);
        g.addColorStop(0, COLORS[m] || "#007aff");
        g.addColorStop(1, "#af52de");
        ctx.strokeStyle = g;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        records.forEach((r, i) =>
          i ? ctx.lineTo(x(i), y(vals[i])) : ctx.moveTo(x(i), y(vals[i])),
        );
        ctx.stroke();

        records.forEach((r, i) => {
          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = COLORS[m] || "#007aff";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x(i), y(vals[i]), 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#8e8e93";
          ctx.font = "11px -apple-system, sans-serif";
          ctx.textAlign = "center";
          if (records.length <= 6 || i % Math.ceil(records.length / 6) === 0)
            ctx.fillText(r.date.slice(5), x(i), h - 12);
        });
      }

      function drawStructureChart() {
        document.getElementById("structureChartType").value === "stacked"
          ? drawStackedChart()
          : drawPieChart();
      }

      function drawStackedChart() {
        const { ctx, w, h } = setupCanvas("structureChart"),
          pieLegend = document.getElementById("pieLegend");
        pieLegend.innerHTML = "";
        if (!records.length) {
          ctx.fillStyle = "#8e8e93";
          ctx.font = "14px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("暂无资产结构数据", w / 2, h / 2);
          return;
        }

        const cats = ["cash", "investment", "mandate", "other"],
          pad = { l: 40, r: 12, t: 20, b: 36 },
          cw = w - pad.l - pad.r,
          ch = h - pad.t - pad.b,
          gap = 8,
          n = records.length,
          bw = Math.max(10, (cw - (n - 1) * gap) / n);

        for (let i = 0; i <= 3; i++) {
          let yy = pad.t + (i * ch) / 3;
          ctx.strokeStyle = "rgba(60,60,67,0.08)";
          ctx.beginPath();
          ctx.moveTo(pad.l, yy);
          ctx.lineTo(w - pad.r, yy);
          ctx.stroke();
          ctx.fillStyle = "#8e8e93";
          ctx.font = "10px -apple-system, sans-serif";
          ctx.textAlign = "right";
          ctx.fillText(100 - i * 33 + "%", pad.l - 4, yy + 3);
        }

        records.forEach((r, i) => {
          const total = num(r.totalAssets) || cats.reduce((s, k) => s + num(r[k]), 0);
          let y = h - pad.b,
            x = pad.l + i * (bw + gap);
          cats.forEach((k) => {
            const val = num(r[k]);
            if (!total || !val) return;
            const sh = (val / total) * ch;
            ctx.fillStyle = COLORS[k];
            ctx.fillRect(x, y - sh, bw, sh);
            y -= sh;
          });
          ctx.fillStyle = "#8e8e93";
          ctx.font = "10px -apple-system, sans-serif";
          ctx.textAlign = "center";
          if (n <= 5 || i % Math.ceil(n / 5) === 0)
            ctx.fillText(r.date.slice(5), x + bw / 2, h - 12);
        });

        pieLegend.innerHTML = cats
          .map(
            (k) =>
              `<div class="legendItem"><span><i class="dot" style="background:${COLORS[k]}"></i>${TYPE_NAME[k]}</span></div>`,
          )
          .join("");
      }

      function drawPieChart() {
        const { ctx, w, h } = setupCanvas("structureChart"),
          pieLegend = document.getElementById("pieLegend"),
          l = records[records.length - 1];
        pieLegend.innerHTML = "";
        if (!l || !l.totalAssets) {
          ctx.fillStyle = "#8e8e93";
          ctx.font = "14px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("暂无资产分类数据", w / 2, h / 2);
          return;
        }

        const data = [
            ["cash", l.cash],
            ["investment", l.investment],
            ["mandate", l.mandate],
            ["other", l.other],
          ].filter((x) => num(x[1]) > 0),
          total = data.reduce((s, x) => s + num(x[1]), 0);

        let start = -Math.PI / 2,
          cx = w / 2,
          cy = h / 2 - 4,
          r = Math.min(w, h) * 0.36;

        data.forEach(([k, v]) => {
          const a = (num(v) / total) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, r, start, start + a);
          ctx.closePath();
          ctx.fillStyle = COLORS[k];
          ctx.fill();
          start += a;
        });

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#1c1c1e";
        ctx.font = "700 13px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("总资产", cx, cy - 2);
        ctx.font = "11px -apple-system, sans-serif";
        ctx.fillStyle = "#8e8e93";
        ctx.fillText(shortMoney(total), cx, cy + 14);

        pieLegend.innerHTML = data
          .map(
            ([k, v]) =>
              `<div class="legendItem"><span><i class="dot" style="background:${COLORS[k]}"></i>${TYPE_NAME[k]}</span><b>${Math.round((num(v) / total) * 100)}%</b></div>`,
          )
          .join("");
      }

      function renderAll() {
        renderSummary();
        renderRecords();
        setTimeout(() => {
          drawLineChart();
          drawStructureChart();
        }, 30);
      }

      function exportXlsx() {
        if (!records.length) {
          alert("暂无数据可导出");

        }
        const summaryRows = [

        ];
        records.forEach((r) =>
          (r.accounts || []).forEach((a) =>
            detailRows.push([

        download(
          buildXlsx([
            { name: "资产汇总", rows: summaryRows },

        );
      }

      function buildXlsx(sheets) {
        const files = {};
        files["[Content_Types].xml"] =
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
          sheets
            .map(
              (s, i) =>
                `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`,
            )
            .join("") +
          "</Types>";
        files["_rels/.rels"] =
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
        files["xl/workbook.xml"] =
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
          sheets
            .map(
              (s, i) =>
                `<sheet name="${xmlEsc(s.name).slice(0, 31)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`,
            )
            .join("") +
          "</sheets></workbook>";
        files["xl/_rels/workbook.xml.rels"] =
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
          sheets
            .map(
              (s, i) =>
                `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`,
            )
            .join("") +
          "</Relationships>";
        sheets.forEach(
          (s, i) =>
            (files[`xl/worksheets/sheet${i + 1}.xml`] = sheetXml(s.rows)),
        );
        return zipStore(
          files,
          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        );
      }

      function sheetXml(rows) {
        const cellRef = (r, c) => {
          let s = "";
          c++;
          while (c) {
            let m = (c - 1) % 26;
            s = String.fromCharCode(65 + m) + s;
            c = Math.floor((c - 1) / 26);
          }
          return s + r;
        };
        const body = rows
          .map(
            (row, ri) =>
              `<row r="${ri + 1}">` +
              row
                .map((v, ci) => {
                  const ref = cellRef(ri + 1, ci);
                  if (typeof v === "number" && isFinite(v))
                    return `<c r="${ref}"><v>${v}</v></c>`;
                  return `<c r="${ref}" t="inlineStr"><is><t>${xmlEsc(v ?? "")}</t></is></c>`;
                })
                .join("") +
              "</row>",
          )
          .join("");
        return (
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>' +
          body +
          "</sheetData></worksheet>"
        );
      }

      function xmlEsc(v) {
        return String(v).replace(
          /[<>&"']/g,
          (m) =>
            ({
              "<": "&lt;",
              ">": "&gt;",
              "&": "&amp;",
              '"': "&quot;",
              "'": "&apos;",
            })[m],
        );
      }

      function crc32(bytes) {
        let c = ~0;
        for (let b of bytes) {
          c ^= b;
          for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xedb88320 & -(c & 1));
        }
        return ~c >>> 0;
      }

      function u16(n) {
        return [n & 255, (n >>> 8) & 255];
      }

      function u32(n) {
        return [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
      }

      function zipStore(files, type) {
        const enc = new TextEncoder();
        let chunks = [],
          central = [],
          offset = 0;
        Object.entries(files).forEach(([name, content]) => {
          const nameB = enc.encode(name),
            data = enc.encode(content),
            crc = crc32(data),
            local = [
              ...u32(0x04034b50),
              ...u16(20),
              ...u16(0),
              ...u16(0),
              ...u16(0),
              ...u16(0),
              ...u32(crc),
              ...u32(data.length),
              ...u32(data.length),
              ...u16(nameB.length),
              ...u16(0),
            ];
          chunks.push(new Uint8Array(local), nameB, data);
          const cent = [
            ...u32(0x02014b50),
            ...u16(20),
            ...u16(20),
            ...u16(0),
            ...u16(0),
            ...u16(0),
            ...u16(0),
            ...u32(crc),
            ...u32(data.length),
            ...u32(data.length),
            ...u16(nameB.length),
            ...u16(0),
            ...u16(0),
            ...u16(0),
            ...u16(0),
            ...u32(0),
            ...u32(offset),
          ];
          central.push(new Uint8Array(cent), nameB);
          offset += local.length + nameB.length + data.length;
        });
        const centralSize = central.reduce((s, a) => s + a.length, 0),
          centralOffset = offset,
          end = [
            ...u32(0x06054b50),
            ...u16(0),
            ...u16(0),
            ...u16(Object.keys(files).length),
            ...u16(Object.keys(files).length),
            ...u32(centralSize),
            ...u32(centralOffset),
            ...u16(0),
          ];
        return new Blob([...chunks, ...central, new Uint8Array(end)], { type });
      }

      function exportJson() {
        download(
          new Blob([JSON.stringify(records, null, 2)], { type: "application/json" }),
          "小龙资产账本_V4备份_" + today() + ".json",
        );
      }

      function importJson(e) {
        const f = e.target.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try {
            records = migrateOld(JSON.parse(rd.result));
            persist();
            alert("导入成功");
          } catch (err) {
            alert("导入失败：文件格式不正确");
          }
        };
        rd.readAsText(f, "utf-8");
      }

      function download(blob, name) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
      }

      function fillDemo() {
        if (records.length && !confirm("会追加三条示例数据，是否继续？")) return;
        [
          ["2025-06-30", 120000, 350000, 80000, 30000, 210000, 0],
          ["2025-12-31", 128000, 362000, 90000, 30000, 205000, 15000],
          ["2026-06-29", 135000, 380000, 105000, 32000, 198000, 20000],
        ].forEach((d, i) => {
          const [dt, c, inv, man, o, liab, sav] = d;
          records.push({
            id: Date.now() + "" + i,
            date: dt,
            title: dt.slice(0, 7) + " 资产汇总",
            savings: sav,
            cash: c,
            investment: inv,
            mandate: man,
            other: o,
            liability: liab,
            totalAssets: c + inv + man + o,
            netWorth: c + inv + man + o - liab,
            note: "示例数据",
            accounts: [
              { name: "招商银行储蓄卡", type: "cash", currency: "CNY", amount: c, rate: 1, baseAmount: c },
              { name: "A股证券账户", type: "investment", currency: "CNY", amount: inv, rate: 1, baseAmount: inv },
              { name: "美股委托管理", type: "mandate", currency: "USD", amount: Math.round(man / 7.25), rate: 7.25, baseAmount: man },
              { name: "房贷按揭", type: "liability", currency: "CNY", amount: liab, rate: 1, baseAmount: liab },
            ],
          });
        });
        records.sort((a, b) => a.date.localeCompare(b.date));
        persist();
      }

      function clearAll() {
        if (confirm("确定清空全部数据吗？建议先导出 JSON 备份。")) {
          records = [];
          persist();
          resetForm();
        }
      }

      function scrollToForm() {
        document.getElementById("formCard").scrollIntoView({ behavior: "smooth" });
      }

      function saveCloudSettings() {
        const cfg = {
          token: document.getElementById("githubToken").value,
          gistId: document.getElementById("gistId").value,
        };
        localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg));
        alert("配置已保存");
      }

      function getCloudConfig() {
        return JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY) || "{}");
      }

      function updateSyncStatus(msg) {
        document.getElementById("syncStatus").innerHTML = `${msg} · ${new Date().toLocaleTimeString()}`;
      }

      async function testCloudConnection() {
        const cfg = getCloudConfig();
        if (!cfg.token || !cfg.gistId) {
          alert("请先填写 Token 和 Gist ID");
          return;
        }
        try {
          const res = await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
            headers: { Authorization: `Bearer ${cfg.token}` },
          });
          if (res.ok) updateSyncStatus("✅ Gist 连接成功");
          else updateSyncStatus("❌ 连接失败，请检查 Token 权限或 Gist ID");
        } catch (e) {
          alert(e.message);
        }
      }

      async function syncUpload() {
        const cfg = getCloudConfig();
        if (!cfg.token || !cfg.gistId) return;
        const todayStr = today();
        const data = JSON.stringify(records, null, 2);
        const body = {
          files: {
            "asset-data.json": { content: data },
            [`backup-${todayStr}.json`]: { content: data },
          },
        };
        const res = await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
          method: "PATCH",
          headers: {
            Authorization: `Bearer ${cfg.token}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        });
        if (res.ok) updateSyncStatus("☁ 已成功备份至 Gist");
        else updateSyncStatus("❌ 上传失败");
      }

      async function syncDownload() {
        const cfg = getCloudConfig();
        if (!cfg.token || !cfg.gistId) return;
        try {
          const res = await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
            headers: { Authorization: `Bearer ${cfg.token}` },
          });
          const gist = await res.json();
          if (gist.files && gist.files["asset-data.json"]) {
            records = migrateOld(JSON.parse(gist.files["asset-data.json"].content));
            persist();
            updateSyncStatus("☁ 已同步最新云端记录");
          }
        } catch (e) {
          alert("下载恢复失败：" + e.message);
        }
      }

      async function autoSync() {
        try {
          const cfg = getCloudConfig();
          if (cfg.token && cfg.gistId) await syncUpload();
        } catch (err) {
          console.error(err);
        }
      }

      function init() {
        document.getElementById("date").value = today();
        const cfg = getCloudConfig();
        if (cfg.token) document.getElementById("githubToken").value = cfg.token;
        if (cfg.gistId) document.getElementById("gistId").value = cfg.gistId;

        document.getElementById("chartMetric").onchange = drawLineChart;
        document.getElementById("structureChartType").onchange = drawStructureChart;
        addAccountLine();
        renderAll();
      }

      window.addEventListener("resize", () => {
        drawLineChart();
        drawStructureChart();
      });

      init();
    </script>
